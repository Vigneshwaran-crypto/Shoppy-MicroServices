spring.application.name=shoppyProducts



server.port=8083
spring.datasource.url=jdbc:mysql://localhost:3306/shoppy_products?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

########MULTIPART_PROPERTIES########
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=5MB
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

app.assetPath=/Users/user/Desktop/vignesh/shoppy/

spring.web.resources.static-locations=file:/Users/user/Desktop/vignesh/shoppy/ 


