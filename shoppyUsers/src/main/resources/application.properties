spring.application.name=shoppyUsers

#server.port=8082

server.port=0
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Faster instance removal when app is terminated
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Better health check
eureka.instance.status-page-url-path=/actuator/health
eureka.instance.health-check-url-path=/actuator/health

spring.datasource.url=jdbc:mysql://localhost:3306/shoppy_users?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

########MULTIPART_PROPERTIES########
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=5MB
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

app.assetPath=/Users/user/Desktop/vignesh/shoppy/

spring.web.resources.static-locations=file:/Users/user/Desktop/vignesh/shoppy/ 


jwt.secret=HelloLearnersWorkForVictoryStartingShoppyApplicationusingJava17.0.4withPID63786


#Kafka config
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=shoppy-events
spring.kafka.consumer.auto-offset-reset=earliest

#Eureka config
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

